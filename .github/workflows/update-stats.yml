name: Update stats

on:
  schedule:
    - cron: "0 9 * * *"  # 12:00 MSK (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate stats and project cards
        env:
          # PAT (read:org + repo) of the profile owner: required, otherwise
          # private repos/commits/PRs/orgs are invisible to the API.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret STATS_TOKEN is not set; refusing to publish public-only numbers"
            exit 1
          fi
          python3 scripts/update_stats.py

      - name: Commit if changed
        run: |
          git add -A assets
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update stats"
          git push
